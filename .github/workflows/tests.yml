name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-tests.txt
      - run: python -m pip install -r requirements-tests.txt
      - name: Translation backend
        run: python -m unittest discover -s engine_support -p "test_*.py"
      - name: Local application API
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Compile native Windows launcher
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $compiler /nologo /target:winexe /platform:x64 /codepage:65001 /reference:System.Windows.Forms.dll /reference:System.Management.dll /out:build\Launcher-test.exe packaging\PaperTranslatorLauncher.cs
          if ($LASTEXITCODE -ne 0) { throw 'Launcher compilation failed' }
